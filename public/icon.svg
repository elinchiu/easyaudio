<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- App Background with safe zone padding -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Headphones Band -->
  <path d="M120 256 C120 180, 180 120, 256 120 C332 120, 392 180, 392 256" 
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Open Book & Sound Waves Symbol -->
  <g filter="url(#glow)">
    <!-- Book Base / Pages -->
    <path d="M150 330 C190 320, 230 335, 256 345 C282 335, 322 320, 362 330 L362 385 C322 375, 282 390, 256 400 C230 390, 190 375, 150 385 Z" fill="url(#bookGrad)" />
    <!-- Spine Line -->
    <line x1="256" y1="345" x2="256" y2="400" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <!-- Book lines left -->
    <line x1="175" y1="348" x2="235" y2="354" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="175" y1="362" x2="235" y2="368" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Book lines right -->
    <line x1="277" y1="354" x2="337" y2="348" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="277" y1="368" x2="337" y2="362" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Left Ear Cup -->
  <rect x="96" y="240" width="48" height="88" rx="24" fill="#ffffff" filter="url(#glow)" />
  <rect x="110" y="254" width="20" height="60" rx="10" fill="#6366f1" />
  
  <!-- Right Ear Cup -->
  <rect x="368" y="240" width="48" height="88" rx="24" fill="#ffffff" filter="url(#glow)" />
  <rect x="382" y="254" width="20" height="60" rx="10" fill="#6366f1" />
  
  <!-- Center Play / Audio Symbol inside -->
  <circle cx="256" cy="235" r="46" fill="#ffffff" opacity="0.95" filter="url(#glow)" />
  <polygon points="246,215 276,235 246,255" fill="#4f46e5" />
</svg>
